<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#58cc02">
<meta name="description" content="Discipline — a friendly habit tracker with 55 practices, philosopher quotes, and book summaries. Works offline.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Discipline">
<title>Discipline — Build habits that stick</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%2358cc02'/%3E%3Cpath d='M150 260l80 80 140-160' fill='none' stroke='white' stroke-width='44' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;-webkit-tap-highlight-color:transparent;
  background:#f7f7f7;
  min-height:100vh;
  padding-bottom:96px;
  font-family:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
  color:#3c3c3c;
  transition:background .6s ease;
}
@media(min-width:721px){ body{padding-bottom:48px} }

:root{
  --card:#ffffff;
  --line:#e5e5e5;
  --line-2:#d4d4d4;
  --text:#3c3c3c;
  --text-2:#4b4b4b;
  --muted:#afafaf;
  --muted-2:#777777;
  --green:#58cc02;      --green-d:#46a302;   --green-l:#e9f7d8;
  --yellow:#ffc800;     --yellow-d:#e5a000;  --yellow-l:#fff4cc;
  --blue:#1cb0f6;       --blue-d:#1899d6;    --blue-l:#ddf4ff;
  --red:#ff4b4b;        --red-d:#e04343;     --red-l:#ffe3e3;
  --purple:#ce82ff;     --purple-d:#a568cc;  --purple-l:#f2e5ff;
  --orange:#ff9600;     --orange-d:#cc7700;  --orange-l:#ffeacc;
  --r:16px;
  --r-sm:10px;
  --r-lg:24px;
}

/* fun animated background — hue shifts with level + time of day */
body{
  background:
    radial-gradient(circle at 15% 10%, var(--bg-1), transparent 55%),
    radial-gradient(circle at 85% 90%, var(--bg-2), transparent 55%),
    linear-gradient(135deg, var(--bg-base) 0%, var(--bg-3) 100%);
  background-attachment:fixed;
  background-size:200% 200%, 200% 200%, 300% 300%;
  animation:bgshift 22s ease-in-out infinite;
}
@keyframes bgshift{
  0%,100%{ background-position:0% 0%, 100% 100%, 0% 50%; }
  50%    { background-position:30% 40%, 70% 60%, 100% 50%; }
}
@media(prefers-reduced-motion:reduce){
  body{animation:none}
}

h1,h2,h3,h4{font-weight:800;letter-spacing:-.01em;margin:0 0 8px;color:var(--text);line-height:1.2}
h1{font-size:26px} h2{font-size:20px} h3{font-size:17px}
p{margin:0 0 10px}
button{font-family:inherit;cursor:pointer}
a{color:var(--blue-d);text-decoration:none;font-weight:700}
a:hover{text-decoration:underline}

/* header */
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:2px solid var(--line)}
.top-in{max-width:900px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.hello{font-size:13px;color:var(--muted-2);font-weight:700;letter-spacing:.02em}
.hello b{display:block;color:var(--text);font-size:16px;font-weight:800;letter-spacing:0}
.lvl-pill{margin-left:auto;display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--yellow-l);border:2px solid #ffd84a;border-radius:20px;font-size:12px;font-weight:800;color:#8a6700}
.lvl-pill svg{width:14px;height:14px}
.gear{background:white;border:2px solid var(--line);width:40px;height:40px;border-radius:12px;color:var(--muted-2);display:grid;place-items:center;border-bottom-width:4px;transition:.1s}
.gear:hover{color:var(--text)}
.gear:active{transform:translateY(2px);border-bottom-width:2px}
.gear svg{width:18px;height:18px}

/* tabs */
.tabs{max-width:900px;margin:0 auto;padding:0 14px 10px;display:flex;gap:6px}
.tab{flex:1;padding:10px 4px;border-radius:12px;background:transparent;border:2px solid transparent;color:var(--muted-2);font-size:13px;font-weight:800;letter-spacing:.02em;transition:.15s}
.tab:hover{color:var(--text)}
.tab.on{color:var(--green-d);background:var(--green-l);border-color:#b7e77c}

.bottomnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:2px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bottomnav-in{display:flex;max-width:520px;margin:0 auto}
.bn{flex:1;background:transparent;border:none;padding:8px 4px 6px;color:var(--muted);font-size:10.5px;font-weight:800;letter-spacing:.04em;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.15s;text-transform:uppercase}
.bn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.bn.on{color:var(--green)}
@media(max-width:720px){ .tabs{display:none} .bottomnav{display:block} .top-in{padding:12px 16px} }

.wrap{max-width:900px;margin:0 auto;padding:20px}
@media(max-width:720px){ .wrap{padding:16px} }
.stack>*+*{margin-top:14px}

/* cards */
.card{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:var(--r);padding:18px}
.card.tight{padding:14px}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.card .hd h3{margin:0}
.hint{color:var(--muted-2);font-size:12.5px;line-height:1.55}
.rule{height:2px;background:var(--line);margin:14px 0;border:none;border-radius:2px}

/* buttons — chunky Duolingo style */
.btn{font:inherit;font-size:14px;font-weight:800;letter-spacing:.02em;padding:11px 18px;border-radius:14px;background:white;color:var(--text);border:2px solid var(--line-2);border-bottom-width:4px;transition:.1s;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{filter:brightness(.98)}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.primary{background:var(--green);border-color:var(--green-d);color:white}
.btn.primary:hover{background:#61dc05}
.btn.yellow{background:var(--yellow);border-color:var(--yellow-d);color:#7a5a00}
.btn.blue{background:var(--blue);border-color:var(--blue-d);color:white}
.btn.purple{background:var(--purple);border-color:var(--purple-d);color:white}
.btn.ghost{background:white;color:var(--text-2)}
.btn.danger{background:white;border-color:var(--red);border-bottom-color:var(--red-d);color:var(--red)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:11px;border-bottom-width:3px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* inputs */
.in,.ta,select.in{width:100%;font:inherit;font-size:15px;font-weight:600;color:var(--text);background:white;border:2px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;transition:.15s}
.in:focus,.ta:focus{border-color:var(--blue)}
.ta{resize:vertical;min-height:86px;line-height:1.55;font-family:inherit}
label.fl{display:block;font-size:12px;color:var(--muted-2);margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase;font-weight:800}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){ .grid2{grid-template-columns:1fr} }

/* onboarding */
.onboard{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.onboard-in{width:100%;max-width:440px}
.onboard .logo{display:flex;justify-content:center;margin-bottom:24px}
.onboard .logo svg{width:76px;height:76px}
.onboard h1{text-align:center;font-size:28px;margin-bottom:8px}
.onboard .sub{text-align:center;color:var(--muted-2);font-size:14.5px;margin-bottom:28px;line-height:1.5}
.onboard .step{display:none}
.onboard .step.on{display:block;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none}}
.onboard .big-in{font-size:20px;padding:16px;text-align:center;font-weight:800}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.lang-opt{display:flex;align-items:center;gap:10px;padding:14px;background:white;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;font-weight:800;font-size:14px;color:var(--text);text-align:left;transition:.1s}
.lang-opt:hover{background:var(--green-l)}
.lang-opt.sel{background:var(--green-l);border-color:var(--green);border-bottom-color:var(--green-d)}
.lang-opt .flag{font-size:22px;line-height:1}
.dots{display:flex;justify-content:center;gap:8px;margin-top:26px}
.dot{width:9px;height:9px;border-radius:50%;background:#d4d4d4;transition:.2s}
.dot.on{background:var(--green);width:24px;border-radius:5px}

/* today */
.hero{padding:22px;background:linear-gradient(135deg,#ffffff, #f4fff0);border-color:#d5eeba;border-bottom-color:#a8d97a}
.hero-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.hero-date{color:var(--muted-2);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800}
.hero-big{display:flex;align-items:baseline;gap:8px}
.hero-big b{font-size:48px;font-weight:900;letter-spacing:-.03em;line-height:1;color:var(--green-d)}
.hero-big span{font-size:22px;color:var(--muted);font-weight:800}
.hero-note{color:var(--text-2);font-size:14px;margin-top:8px;font-weight:600}
.chain{display:grid;grid-template-columns:repeat(28,1fr);gap:4px;margin-top:18px}
.chip{aspect-ratio:1;border-radius:5px;background:#eeeeee}
.chip.full{background:var(--green)}
.chip.part{background:#b7e77c}
.chip.off{background:#f0f0f0;border:2px solid #e5e5e5}
.chain-cap{display:flex;justify-content:space-between;margin-top:8px;font-size:10.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;font-weight:800}

.nextup{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:var(--r);background:white;border:2px solid #b7e77c;border-bottom-width:4px;border-bottom-color:#8fcf4f}
.nextup .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--green-d);font-weight:800}
.nextup .nm{font-size:17px;font-weight:800;margin-top:3px}
.nextup .mt{font-size:12.5px;color:var(--muted-2);margin-top:2px;font-weight:700}

.habit{padding:16px 18px;border-radius:var(--r);background:white;border:2px solid var(--line);border-bottom-width:4px;transition:.15s;cursor:pointer}
.habit:hover{border-color:#d4d4d4;background:#fafafa}
.habit.done{background:var(--green-l);border-color:#b7e77c;border-bottom-color:#a8d97a}
.habit .row{display:flex;align-items:flex-start;gap:14px}
.check{width:44px;height:44px;flex:0 0 auto;border-radius:50%;border:3px solid var(--line-2);background:white;color:transparent;display:grid;place-items:center;transition:.15s;font-size:22px;font-weight:900;margin-top:2px}
.check:hover{border-color:var(--green)}
.check.on{background:var(--green);border-color:var(--green-d);color:white}
.habit .nm{font-size:16px;font-weight:800}
.habit.done .nm{color:var(--green-d);text-decoration:line-through;text-decoration-thickness:2px}
.habit .meta{font-size:12.5px;color:var(--muted-2);margin-top:3px;font-weight:700}
.habit .meta b{color:var(--orange);font-weight:800}
.strip{display:flex;gap:5px;margin-top:12px}
.sd{width:26px;height:26px;border-radius:8px;font-size:11px;display:grid;place-items:center;color:var(--muted);background:#f0f0f0;font-weight:800}
.sd.on{background:var(--green);color:white}
.sd.miss{background:var(--red-l);color:var(--red)}
.sd.off{background:transparent;border:2px solid var(--line);color:var(--muted)}
.quote{margin-top:14px;padding:12px 14px;border-radius:12px;background:#fafafa;border-left:4px solid var(--yellow);font-size:13.5px;color:var(--text-2);line-height:1.55;font-style:italic;font-weight:600}

/* progress */
.chart{display:flex;align-items:flex-end;gap:8px;height:140px;margin:8px 0 4px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar2{width:100%;border-radius:8px 8px 4px 4px;background:#eeeeee;min-height:5px;transition:.3s;border:2px solid transparent;border-bottom-width:4px;border-bottom-color:rgba(0,0,0,.1)}
.bar2.g{background:var(--green);border-color:var(--green-d);border-bottom-color:var(--green-d)}
.bar2.m{background:var(--yellow);border-color:var(--yellow-d);border-bottom-color:var(--yellow-d)}
.bar2.l{background:var(--orange);border-color:var(--orange-d);border-bottom-color:var(--orange-d)}
.blab{font-size:10.5px;color:var(--muted);font-weight:800;text-transform:uppercase}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:white;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px 8px;text-align:center}
.stat b{font-size:24px;font-weight:900;display:block;letter-spacing:-.02em;color:var(--text)}
.stat span{font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px;display:block;font-weight:800}
.hbar{height:12px;border-radius:8px;background:#f0f0f0;overflow:hidden;margin-top:8px;border:2px solid var(--line)}
.hbar>i{display:block;height:100%;background:linear-gradient(90deg,#8de24d,var(--green));border-radius:8px;transition:.4s}
.daylist{display:flex;flex-direction:column;gap:10px}
.drow{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700}
.drow .dn{width:70px;color:var(--muted-2)}
.drow .db{flex:1;height:10px;border-radius:6px;background:#f0f0f0;overflow:hidden;border:1.5px solid var(--line)}
.drow .db>i{display:block;height:100%;background:var(--green);border-radius:6px}
.drow .dv{width:56px;text-align:right;color:var(--text-2);font-variant-numeric:tabular-nums;font-weight:800}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{text-align:center;padding:16px 8px;border-radius:16px;background:white;border:2px solid var(--line);border-bottom-width:4px;opacity:.45;transition:.2s}
.badge.on{opacity:1;border-color:var(--yellow);border-bottom-color:var(--yellow-d);background:var(--yellow-l)}
.badge b{font-size:26px;font-weight:900;display:block;color:var(--text)}
.badge span{font-size:10.5px;color:var(--muted-2);letter-spacing:.06em;text-transform:uppercase;font-weight:800}
.badge.on b{color:#8a6700}

/* discover */
.searchwrap{position:relative;margin-bottom:14px}
.searchwrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.searchwrap .in{padding-left:42px}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;padding:9px 16px;border-radius:20px;background:white;border:2px solid var(--line);border-bottom-width:4px;color:var(--text-2);font-size:13px;font-weight:800;transition:.1s;white-space:nowrap}
.cat:hover{background:var(--green-l);border-color:#b7e77c}
.cat.on{background:var(--green);border-color:var(--green-d);color:white}
.lib-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){ .lib-grid{grid-template-columns:1fr 1fr} }
.lib-card{text-align:left;background:white;border:2px solid var(--line);border-bottom-width:4px;border-radius:var(--r);padding:16px;transition:.15s;color:inherit;display:flex;flex-direction:column;gap:6px}
.lib-card:hover{border-color:var(--green);background:var(--green-l)}
.lib-card .cn{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--green-d);font-weight:800}
.lib-card .nn{font-size:16px;font-weight:800;color:var(--text)}
.lib-card .qm{font-size:12px;color:var(--muted-2);margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.4}
.lib-card .tag{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.03em;text-transform:uppercase;margin-top:4px}

.crumb{display:inline-flex;align-items:center;gap:6px;background:white;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;color:var(--text-2);font-size:12.5px;font-weight:800;padding:8px 12px;margin-bottom:14px}
.crumb:hover{background:var(--green-l);border-color:#b7e77c}
.crumb svg{width:14px;height:14px}
.title-block h1{margin-bottom:6px}
.title-block .sub{color:var(--muted-2);font-size:13px;font-weight:700}
.qbox{padding:18px 20px;border-radius:14px;background:var(--yellow-l);border:2px solid #ffd84a;border-left:6px solid var(--yellow);font-size:15px;color:#7a5a00;line-height:1.55;font-style:italic;font-weight:700}
.list{margin:0;padding:0;list-style:none}
.list li{padding:10px 0;font-size:14px;color:var(--text-2);border-bottom:2px solid var(--line);display:flex;gap:12px;align-items:flex-start;font-weight:600}
.list li:last-child{border-bottom:none}
.list li::before{content:"";flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--green);margin-top:8px}
.book{padding:14px 0;border-bottom:2px solid var(--line)}
.book:last-child{border-bottom:none;padding-bottom:0}
.book:first-child{padding-top:0}
.book b{display:block;font-size:15px;font-weight:800;color:var(--text)}
.book .au{font-size:12px;color:var(--muted-2);margin-top:2px;display:block;font-weight:700}
.book .sm{font-size:13.5px;color:var(--text-2);margin-top:7px;line-height:1.55;font-weight:600}

/* timer */
.ringwrap{display:flex;flex-direction:column;align-items:center;padding:20px 0 8px}
.ring{position:relative;width:250px;height:250px}
.ring svg{transform:rotate(-90deg)}
.ring .inr{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .inr b{font-size:56px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1;color:var(--green-d)}
.ring .inr span{display:block;font-size:12px;color:var(--muted-2);letter-spacing:.08em;text-transform:uppercase;margin-top:8px;font-weight:800}

.daypick{display:flex;gap:6px;margin-bottom:14px}
.daypick label{flex:1;text-align:center;padding:11px 0;border-radius:12px;background:white;border:2px solid var(--line);border-bottom-width:4px;font-size:12.5px;color:var(--muted-2);cursor:pointer;transition:.1s;font-weight:800}
.daypick input{display:none}
.daypick label:hover{background:var(--green-l);border-color:#b7e77c;color:var(--green-d)}
.daypick label:has(input:checked){background:var(--green);border-color:var(--green-d);color:white}

.pill{display:inline-block;padding:4px 10px;border-radius:12px;font-size:11px;background:#f0f0f0;border:2px solid var(--line);color:var(--muted-2);margin:0 4px 4px 0;font-weight:800}
.pill.on{background:var(--green-l);border-color:#b7e77c;color:var(--green-d)}
.empty{text-align:center;padding:44px 20px;color:var(--muted-2);font-size:14px;line-height:1.7;font-weight:700}
.empty .ic{width:56px;height:56px;margin:0 auto 14px;color:var(--muted);opacity:.7}

.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);z-index:100;pointer-events:none;opacity:0;transition:.25s;max-width:calc(100vw - 32px)}
@media(min-width:721px){ .toast{bottom:32px} }
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .tt{background:#3c3c3c;border-radius:14px;padding:12px 20px;font-size:13.5px;font-weight:800;box-shadow:0 10px 32px rgba(0,0,0,.25);color:white}

#err{display:none;position:fixed;inset:0;background:#ff4b4b;color:white;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;padding:22px;overflow:auto;z-index:99999;white-space:pre-wrap}

:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:10px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="err"></div>

<script>
"use strict";

/* ---------- global error surface ---------- */
window.addEventListener("error", function (ev) {
  var el = document.getElementById("err");
  if (el && el.style.display !== "block") {
    el.style.display = "block";
    el.textContent = "Error: " + (ev.message || ev.error) + "\n" + (ev.filename || "") + (ev.lineno ? ":" + ev.lineno : "");
  }
});
window.addEventListener("unhandledrejection", function (ev) {
  var el = document.getElementById("err");

  }
});

/* ============================================================
   Utilities
   ============================================================ */
const pad = n => String(n).padStart(2, "0");
const dk = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pk = k => { const [a,b,c] = k.split("-").map(Number); return new Date(a, b-1, c); };
const mid = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const today = () => mid(new Date());
const addD = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); x.setHours(0,0,0,0); return x; };
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DL = {0:"S",1:"M",2:"T",3:"W",4:"T",5:"F",6:"S"};
const DORD = [1,2,3,4,5,6,0];
const DFULL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DSHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate = d => `${DFULL[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`;
const hash = s => { let h=0; for (let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; };

function detectCat(name){
  const n = (name||"").toLowerCase();
  for (const [cat, words] of TYPE_HINTS) if (words.some(w => n.includes(w))) return cat;
  return "General";
}

/* ============================================================
   State — clean start
   ============================================================ */
const KEY = "discipline-tracker-v4";
let state = loadState();

function blankState(){
  return {
    profile: null,
    habits: [],
    log: {},
    reflections: {},
    settings: { notifications: false, ai: "deepseek" },
    reminded: {},
    timer: null
  };
}
function loadState(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const s = JSON.parse(raw);
      const b = blankState();
      return Object.assign(b, s, {
        habits: s.habits || [],
        log: s.log || {},
        reflections: s.reflections || {},
        settings: Object.assign(b.settings, s.settings || {}),
        reminded: s.reminded || {},
        timer: s.timer || null
      });
    }
  } catch(e) { console.warn(e); }
  const s = blankState();
  try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e){}
  return s;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

/* ============================================================
   Logic
   ============================================================ */
const schedOn = (h,d) => h.days.includes(d.getDay()) && dk(d) >= h.created;
const isDone = (id,k) => !!(state.log[k] && state.log[k][id]);
function mark(id,k,val=true){
  state.log[k] = state.log[k] || {};
  if (val) state.log[k][id] = true; else delete state.log[k][id];
  if (!Object.keys(state.log[k]).length) delete state.log[k];
  save();
}
function habitsOn(k){
  const d = pk(k);
  return state.habits.filter(h => schedOn(h,d)).sort((a,b) => a.time.localeCompare(b.time));
}
function dayStats(k){
  const hs = habitsOn(k);
  const done = hs.filter(h => isDone(h.id,k)).length;
  return {total:hs.length, done, pct:hs.length ? Math.round(done/hs.length*100) : 0};
}
function curStreak(h){
  const t = today(); let c = 0, d = new Date(t), g = 0;
  while (g++ < 4000) {
    if (dk(d) < h.created) break;
    if (schedOn(h,d)) {
      if (isDone(h.id, dk(d))) c++;
      else if (dk(d) !== dk(t)) break;
    }
    d = addD(d, -1);
  }
  return c;
}
function bestStreak(h){
  let best = 0, cur = 0, d = pk(h.created), t = today(), g = 0;
  while (d <= t && g++ < 4000) {
    if (schedOn(h,d)) {
      if (isDone(h.id, dk(d))) { cur++; if (cur > best) best = cur; }
      else if (dk(d) !== dk(t)) cur = 0;
    }
    d = addD(d, 1);
  }
  return best;
}
function rate(h, days){
  const t = today(); let s = 0, dn = 0;
  for (let i = 0; i < days; i++) {
    const x = addD(t, -i);
    if (schedOn(h,x)) { s++; if (isDone(h.id, dk(x))) dn++; }
  }
  return {sched:s, done:dn, pct:s ? Math.round(dn/s*100) : 0};
}
function xpTotal(){
  let n = 0;
  for (const k in state.log) for (const id in state.log[k]) if (state.log[k][id]) n++;
  return n;
}
const lvl = () => { const x = xpTotal(); return {xp:x, level:Math.floor(x/100)+1, into:x%100}; };

function quoteFor(h, k){
  const lib = LIB.find(x => x.n.toLowerCase() === h.name.toLowerCase());
  if (lib) return lib.q;
  const arr = [
    "We are what we repeatedly do. Excellence, then, is not an act, but a habit. — Will Durant",
    "Discipline equals freedom. — Jocko Willink",
    "You do not rise to the level of your goals. You fall to the level of your systems. — James Clear",
    "The secret of getting ahead is getting started. — Mark Twain",
    "A year from now you may wish you had started today. — Karen Lamb",
    "Success is the sum of small efforts repeated day in and day out. — Robert Collier",
    "Well begun is half done. — Aristotle",
    "It is not that we have a short time to live, but that we waste much of it. — Seneca"
  ];
  return arr[hash(k + h.id) % arr.length];
}

/* ============================================================
   Background — hue shifts with level + time of day
   ============================================================ */
function applyBackground(){
  const {level} = lvl();
  const h = new Date().getHours();
  const base = (level * 41 + h * 12) % 360;
  const s = document.documentElement.style;
  s.setProperty("--bg-base", `hsl(${base}, 75%, 95%)`);
  s.setProperty("--bg-1", `hsla(${(base + 40) % 360}, 85%, 82%, .55)`);
  s.setProperty("--bg-2", `hsla(${(base + 200) % 360}, 80%, 85%, .55)`);
  s.setProperty("--bg-3", `hsl(${(base + 30) % 360}, 70%, 93%)`);
}

function render(){
  applyBackground();
  const root = document.getElementById("app");

  if (!state.profile) {
    root.innerHTML = onboardHTML();
    post();
    return;
  }
  setLang(state.profile.lang);
  root.innerHTML = header() + "<main class='wrap'>" + page() + "</main>" + bottomNav();
  post();
}

/* ================= TODAY ================= */
function vToday(){
  const t = today(), tk = dk(t);
  const s = dayStats(tk);
  const hs = habitsOn(tk);
  let chain = "";
  for (let i = 27; i >= 0; i--) {
    const d = addD(t, -i), k = dk(d), ds = dayStats(k);
    const cls = ds.total === 0 ? "chip off" : (ds.done === ds.total ? "chip full" : (ds.done > 0 ? "chip part" : "chip"));
    chain += `<div class="${cls}" title="${k} — ${ds.done}/${ds.total}"></div>`;
  }
  const pending = hs.filter(h => !isDone(h.id, tk));
  const next = pending[0];
  const refl = state.reflections[tk] || "";
  const noHabitsAtAll = state.habits.length === 0;
  return `
  <div class="stack">
    <section class="card hero">
      <div class="hero-top"><div class="hero-date">${fmtDate(t)}</div></div>
      <div class="hero-big"><b>${s.done}</b><span>/ ${s.total}</span></div>
      <div class="hero-note">
        ${s.total===0 ? T.noSched :
          s.done===s.total ? T.allDone :
          `${s.total-s.done} ${T.remaining}`}
      </div>
      <div class="chain">${chain}</div>
      <div class="chain-cap"><span>28 ${T.daysL}</span><span>${T.today}</span></div>
    </section>

    ${hs.length===0 ? "" : next ? `
      <div class="nextup">
        <div style="flex:1">
          <div class="lbl">${T.nextUp}</div>
          <div class="nm">${esc(next.name)}</div>
          <div class="mt">${next.time} · ${next.duration} min</div>
        </div>
        <button class="btn primary sm" data-act="timer" data-id="${next.id}">${T.start}</button>
      </div>` : `
      <div class="nextup">
        <div style="flex:1"><div class="lbl">${T.allClear}</div><div class="nm">${T.allDone}</div></div>
      </div>`}

    ${hs.length===0 ?
      `<div class="card empty">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div>
        ${noHabitsAtAll ? T.noHabits : T.noSched}
        <div style="margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <button class="btn primary sm" data-act="tab" data-tab="discover">${T.browseLib}</button>
          <button class="btn ghost sm" data-act="tab" data-tab="habits">${T.addHabit}</button>
        </div>
      </div>`
      : hs.map(h => habitCard(h, tk)).join("")}

    <section class="card">
      <div class="hd"><h3>${T.reflection}</h3><span class="hint">${T.autosaved}</span></div>
      <textarea class="ta" id="refl" placeholder="${T.reflectionPh}">${esc(refl)}</textarea>
    </section>
  </div>`;
}
function habitCard(h, tk){
  const done = isDone(h.id, tk);
  const st = curStreak(h);
  const t = today();
  let strip = "";
  for (let i = 6; i >= 0; i--) {
    const d = addD(t, -i), k = dk(d);
    const sch = schedOn(h, d), dn = isDone(h.id, k);
    strip += `<span class="sd ${!sch?"off":dn?"on":"miss"}">${DL[d.getDay()]}</span>`;
  }
  return `
  <article class="habit ${done?"done":""}" data-act="habit" data-id="${h.id}">
    <div class="row">
      <button class="check ${done?"on":""}" data-act="toggle" data-id="${h.id}" aria-label="${T.done}">✓</button>
      <div style="flex:1;min-width:0">
        <div class="nm">${esc(h.name)}</div>
        <div class="meta">${h.time} · ${h.duration} min${st>0?` · <b>${st} ${T.daysL} ${T.streakL}</b>`:""}</div>
        <div class="strip">${strip}</div>
        <div class="quote">"${esc(quoteFor(h, tk))}"</div>
      </div>
      <button class="btn primary sm" data-act="timer" data-id="${h.id}" aria-label="${T.startTimer}">▶</button>
    </div>
  </article>`;
}

/* ================= TIMER ================= */
function vTimer(){
  const t = state.timer;
  if (!t) return `<div class="card empty">${T.noTimer}<div style="margin-top:16px"><button class="btn primary sm" data-act="tab" data-tab="today">${T.backToday}</button></div></div>`;
  const h = state.habits.find(x => x.id === t.habitId);
  if (!h) { state.timer = null; save(); return `<div class="card empty">—</div>`; }
  const rem = t.running ? Math.max(0, t.endsAt - Date.now()) : t.remaining;
  const total = t.total || h.duration * 60000;
  const R = 110, C = 2 * Math.PI * R;
  const prog = Math.min(1, Math.max(0, 1 - rem/total));
  return `
  <div class="stack">
    <button class="crumb" data-act="habit" data-id="${h.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>${esc(h.name)}</button>
    <section class="card">
      <div class="ringwrap">
        <div class="ring">
          <svg width="250" height="250">
            <circle cx="125" cy="125" r="${R}" fill="none" stroke="#eeeeee" stroke-width="14"/>
            <circle id="tring" cx="125" cy="125" r="${R}" fill="none" stroke="#58cc02" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-prog)).toFixed(1)}"/>
          </svg>
          <div class="inr"><div><b id="tcount">${fmtMS(rem)}</b><span>${esc(h.name)}</span></div></div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:26px">
          ${t.running ? `<button class="btn primary" data-act="tpause">${T.pause}</button>` : `<button class="btn primary" data-act="tstart">${rem<total?T.resume:T.start}</button>`}
          <button class="btn ghost" data-act="treset">${T.resetT}</button>
          <button class="btn yellow" data-act="tdone">${T.markDone}</button>
        </div>
        <p class="hint" style="margin-top:20px;text-align:center;max-width:340px">${T.timerS}</p>
      </div>
    </section>
  </div>`;
}
function fmtMS(ms){ const s = Math.max(0, Math.ceil(ms/1000)); return `${Math.floor(s/60)}:${pad(s%60)}`; }
function updateTimerUI(){
  const t = state.timer;
  if (!t || route.name !== "timer") return;
  const c = document.getElementById("tcount"), r = document.getElementById("tring");
  if (!c || !r) return;
  const rem = t.running ? Math.max(0, t.endsAt - Date.now()) : t.remaining;
  const total = t.total || 1;
  c.textContent = fmtMS(rem);
  const C = 2 * Math.PI * 110;
  r.setAttribute("stroke-dashoffset", (C * Math.min(1, Math.max(0, 1 - rem/total))).toFixed(1));
}
function openTimer(id){
  const h = state.habits.find(x => x.id === id);
  if (!h) return;
  const total = h.duration * 60000;
  state.timer = {habitId:id, total, remaining:total, endsAt:null, running:false};
  save(); go({name:"timer"});
}
function startT(){ const t = state.timer; if (!t) return; if (t.remaining <= 0) t.remaining = t.total; t.endsAt = Date.now() + t.remaining; t.running = true; save(); render(); }
function pauseT(){ const t = state.timer; if (!t || !t.running) return; t.remaining = Math.max(0, t.endsAt - Date.now()); t.running = false; save(); render(); }
function resetT(){ const t = state.timer; if (!t) return; t.remaining = t.total; t.running = false; t.endsAt = null; save(); render(); }
function doneT(){
  const t = state.timer; if (!t) return;
  mark(t.habitId, dk(today()), true);
  const h = state.habits.find(x => x.id === t.habitId);
  state.timer = null; save();
  if (route.name === "timer") go({name:"today"}); else render();
  if (h) toast(`${h.name} ${T.done} ✓`);
  beep();
}

/* ================= PROGRESS ================= */
function vProgress(){
  const t = today();
  let chart = "";
  for (let i = 6; i >= 0; i--) {
    const d = addD(t, -i), k = dk(d), s = dayStats(k);
    const cls = s.pct >= 80 ? "g" : s.pct >= 40 ? "m" : s.pct > 0 ? "l" : "";
    chart += `<div class="bcol"><div class="bar2 ${cls}" style="height:${Math.max(5, s.pct)}%" title="${k}: ${s.done}/${s.total}"></div><div class="blab">${DL[d.getDay()]}</div></div>`;
  }
  function week(off){
    let dn = 0, tt = 0;
    for (let i = 0; i < 7; i++) {
      const k = dk(addD(t, -(off*7+i)));
      const s = dayStats(k); dn += s.done; tt += s.total;
    }
    return {pct: tt ? Math.round(dn/tt*100) : 0};
  }
  const tw = week(0), lw = week(1), delta = tw.pct - lw.pct;
  const rates = state.habits.map(h => ({h, ...rate(h,7)})).filter(x => x.sched > 0);
  const strong = rates.length ? rates.reduce((a,b) => b.pct > a.pct ? b : a) : null;
  const weak = rates.length ? rates.reduce((a,b) => b.pct < a.pct ? b : a) : null;
  let dayList = "";
  for (let i = 13; i >= 0; i--) {
    const d = addD(t, -i), k = dk(d), s = dayStats(k);
    dayList += `<div class="drow"><div class="dn">${DSHORT[d.getDay()]} ${d.getDate()}</div><div class="db"><i style="width:${s.pct}%"></i></div><div class="dv">${s.done}/${s.total}</div></div>`;
  }
  const perHabit = state.habits.map(h => {
    const r = rate(h, 30);
    return `<div style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:800"><span>${esc(h.name)}</span><span class="hint">${r.pct}% · ${r.done}/${r.sched}</span></div>
      <div class="hbar"><i style="width:${r.pct}%"></i></div>
      <div class="hint" style="margin-top:6px">${curStreak(h)} ${T.current} · ${bestStreak(h)} ${T.best}</div>
    </div>`;
  }).join("");
  const maxBest = state.habits.length ? Math.max(...state.habits.map(bestStreak)) : 0;
  const badges = [7,21,66].map(n => `<div class="badge ${maxBest>=n?"on":""}"><b>${n}</b><span>${T.daysL}</span></div>`).join("");
  return `
  <div class="stack">
    <div><h1 style="margin:0 0 4px">${T.progress}</h1><div class="hint">${T.xpL}: ${xpTotal()} · ${T.lvlL} ${lvl().level}</div></div>
    <section class="card"><div class="hd"><h3>${T.last7}</h3></div><div class="chart">${chart}</div></section>
    <section class="card">
      <div class="hd"><h3>${T.weeklyReview}</h3></div>
      <div class="statgrid">
        <div class="stat"><b>${tw.pct}%</b><span>${T.thisWeek}</span></div>
        <div class="stat"><b>${lw.pct}%</b><span>${T.lastWeek}</span></div>
        <div class="stat"><b style="color:${delta>0?"var(--green-d)":delta<0?"var(--red)":"var(--text)"}">${delta>0?"+":""}${delta}%</b><span>${T.changeL}</span></div>
      </div>
      ${strong ? `<hr class="rule"><div style="font-size:14px;color:var(--text-2);font-weight:700"><div>💪 <b>${T.strongest}</b> — ${esc(strong.h.name)} · ${strong.pct}%</div><div style="margin-top:6px">🎯 <b>${T.needsWork}</b> — ${esc(weak.h.name)} · ${weak.pct}%</div></div>` : ""}
    </section>
    <section class="card"><div class="hd"><h3>${T.dayByDay}</h3><span class="hint">${T.last14}</span></div><div class="daylist">${dayList}</div></section>
    <section class="card"><div class="hd"><h3>${T.perHabit}</h3><span class="hint">${T.last30}</span></div>${state.habits.length ? perHabit : `<p class="hint">—</p>`}</section>
    <section class="card">
      <div class="hd"><h3>${T.badges}</h3></div>
      <div class="badges">${badges}</div>
      <p class="hint" style="margin-top:14px">${T.longest}: <b style="color:var(--text)">${maxBest}</b> ${T.daysL}.</p>
    </section>
  </div>`;
}

/* ================= SETTINGS ================= */

  const ai = state.settings.ai || "deepseek";
  const langs = Object.keys(I18N);
  return `
  <div class="stack">
    <div><h1 style="margin:0 0 4px">${T.settings}</h1><div class="hint">${esc(state.profile.name)}</div></div>

    <section class="card">
      <div class="hd"><h3>${T.langQ}</h3></div>
      <div class="lang-grid">
        ${langs.map(code => {
          const L = I18N[code];
          const sel = state.profile.lang === code;
          return `<button class="lang-opt ${sel?"sel":""}" data-act="setlang" data-lang="${code}">
            <span class="flag">${L.flag}</span><span>${L.label}</span>
          </button>`;
        }).join("")}
      </div>
    </section>

    <section class="card">
      <div class="hd"><h3>${T.notifications}</h3></div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <div><div style="font-weight:800">${T.sysNotif}</div><div class="hint" style="margin-top:3px">${sup ? T.permission + ": " + perm : T.notSupported}</div></div>
        <button class="btn ${on?"primary":"ghost"}" data-act="notif">${on?T.on:T.off}</button>
      </div>
      <p class="hint" style="margin-top:14px">${T.notifS}</p>
    </section>

    <section class="card">
      <div class="hd"><h3>${T.aiCoach}</h3></div>
      <div class="grid2">
        <button class="btn ${ai==="deepseek"?"blue":"ghost"}" data-act="setai" data-v="deepseek">DeepSeek</button>
        <button class="btn ${ai==="populi"?"purple":"ghost"}" data-act="setai" data-v="populi">Populi AI</button>
      </div>
      <p class="hint" style="margin-top:12px">${T.quizMe} → <b>Gemini</b></p>
    </section>

    <section class="card">
      <div class="hd"><h3>${T.installApp}</h3></div>
      <p class="hint" style="margin-bottom:12px">${T.installS}</p>
      <button class="btn primary block" id="installBtn" data-act="install">${T.install}</button>
    </section>

    <section class="card">
      <div class="hd"><h3>${T.data}</h3></div>
      <p class="hint" style="margin-bottom:14px">${T.dataS}</p>
      <button class="btn block" style="margin-bottom:10px" data-act="export">${T.exportB}</button>
      <button class="btn block" style="margin-bottom:10px" data-act="import">${T.importB}</button>
      <input type="file" id="importfile" accept="application/json,.json" hidden>

    <section class="card">
      <div class="hd"><h3>${T.overview}</h3></div>
      <div class="statgrid">
        <div class="stat"><b>${state.habits.length}</b><span>${T.habitsC}</span></div>
        <div class="stat"><b>${xpTotal()}</b><span>${T.xpL}</span></div>
        <div class="stat"><b>${lvl().level}</b><span>${T.lvlL}</span></div>
      </div>

  </div>`;
}

/* ============================================================
   Post-render
   ============================================================ */
function post(){
  const r = document.getElementById("refl");
  if (r) r.addEventListener("input", () => { state.reflections[dk(today())] = r.value; save(); });

  const nameIn = document.getElementById("ob-name");
  if (nameIn) {
    nameIn.addEventListener("input", () => { onboardDraft.name = nameIn.value; });
    nameIn.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); document.querySelector('[data-act="ob-next"]').click(); }
    });
  }

  const q = document.getElementById("lib-q");
  if (q) {
    q.addEventListener("input", () => {
      libQuery = q.value;
      clearTimeout(post._t);
      post._t = setTimeout(() => {
        const pos = q.selectionStart;
        render();
        const nq = document.getElementById("lib-q");
        if (nq) { nq.focus(); try { nq.setSelectionRange(pos, pos); } catch(e){} }
      }, 160);
    });
  }

  const file = document.getElementById("importfile");
  if (file) file.addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const d = JSON.parse(reader.result);
        if (!d || !Array.isArray(d.habits)) throw new Error("bad");
        const b = blankState();
        state = Object.assign(b, d, {
          habits: d.habits,
          log: d.log || {},
          reflections: d.reflections || {},
          settings: Object.assign(b.settings, d.settings || {}),
          reminded: {},
          timer: null
        });
        save(); render(); toast(T.imported);
      } catch(err) { toast("—"); }
    };
    reader.readAsText(f);
    e.target.value = "";
  });
}

/* ============================================================
   Events
   ============================================================ */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;

  switch (act) {
    /* onboarding */
    case "ob-next": {
      const n = (document.getElementById("ob-name").value || "").trim();
      if (!n) return toast(T.giveName);
      onboardDraft.name = n;
      onboardStep = 2;
      render();
      break;
    }
    case "ob-lang":
      onboardDraft.lang = el.dataset.lang;
      setLang(onboardDraft.lang);
      render();
      break;
    case "ob-start": {
      if (!onboardDraft.name) { onboardStep = 1; return render(); }
      state.profile = {
        name: onboardDraft.name.slice(0, 24),
        lang: onboardDraft.lang || "en",
        created: dk(today())
      };
      save();
      toast(`${T.hello}, ${state.profile.name}!`);
      render();
      break;
    }

    /* app */
    case "tab":
      if (el.dataset.tab === "discover") { libQuery = ""; libCat = "All"; }
      go({name: el.dataset.tab});
      break;
    case "libCat": libCat = el.dataset.cat; render(); break;
    case "libOpen": go({name:"lib", id: el.dataset.id}); break;
    case "libAdd": libAdd(el.dataset.id); break;
    case "toggle": {
      const id = el.dataset.id, k = dk(today());
      const now = !isDone(id, k);
      mark(id, k, now);
      if (now) { const h = state.habits.find(x => x.id === id); toast(`${h ? h.name : ""} ${T.done} ✓`); }
      render();
      break;
    }
    case "habit": go({name:"habit", id: el.dataset.id}); break;
    case "timer": openTimer(el.dataset.id); break;
    case "del": {
      const id = el.dataset.id, h = state.habits.find(x => x.id === id);
      if (!h) break;
      if (!confirm(`${T.confirmDel} "${h.name}"`)) break;
      state.habits = state.habits.filter(x => x.id !== id);
      if (state.timer && state.timer.habitId === id) state.timer = null;
      save(); toast(T.habitDeleted); render();
      break;
    }
    case "addHabit": addHabit(); break;

    case "coach": {
      const h = state.habits.find(x => x.id === el.dataset.id);
      const box = document.getElementById("coach-in");
      const txt = box ? box.value.trim() : "";
      if (!h) break;
      if (!txt) { toast(T.descr); break; }
      const prompt = `I'm working on this daily habit: "${h.name}" (${h.duration} minutes, at ${h.time}).\n\nWhat I do: ${txt}\n\nPlease act as my habit coach. Give me specific, practical advice: what to change, how to handle the obstacle I described, and one small thing to try tomorrow.`;
      openAI(prompt, el.dataset.ai || state.settings.ai);
      break;
    }
    case "quiz": {
      const h = state.habits.find(x => x.id === el.dataset.id);
      const topicEl = document.getElementById("quiz-t");
      const diffEl = document.getElementById("quiz-d");
      const topic = topicEl ? topicEl.value.trim() : "";
      const diff = diffEl ? diffEl.value : "Medium";
      if (!topic) { toast(T.topicNeed); break; }
      const prompt = `Create a quiz on ${topic}. Difficulty: ${diff}.\nContext: I'm building a daily habit called "${h ? h.name : "this"}".\n\nAsk me 5 questions, one at a time. Wait for my answer before asking the next. After each answer, tell me briefly whether I was right, then move on. At the end, give me a score out of 5 and one thing to review.`;
      askGemini(prompt);
      break;
    }

    case "tstart": startT(); break;
    case "tpause": pauseT(); break;
    case "treset": resetT(); break;
    case "tdone": doneT(); break;

    case "notif": {
      if (!("Notification" in window)) { toast(T.notSupported); break; }
      if (state.settings.notifications) { state.settings.notifications = false; save(); render(); toast(T.notifOff); }
      else {
        Notification.requestPermission().then(p => {
          state.settings.notifications = (p === "granted");
          save(); render();
          toast(p === "granted" ? T.notifOn : T.denied);
        });
      }
      break;
    }
    case "setai": state.settings.ai = el.dataset.v; save(); render(); toast(T.aiSet + el.dataset.v); break;
    case "setlang": {
      state.profile.lang = el.dataset.lang;
      setLang(state.profile.lang);
      save(); render();
      break;
    }
    case "install": installApp(); break;

    case "export": {
      const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `discipline-${dk(today())}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      toast(T.saved);
      break;
    }
    case "import": {
      const f = document.getElementById("importfile");
      if (f) f.click();
      break;
    }
    case "wipe": {
      if (!confirm(T.confirmWipe)) return;
      const profile = state.profile;
      localStorage.removeItem(KEY);
      state = blankState();
      state.profile = profile; // keep name + language, wipe habits/history
      save(); go({name:"today"}); toast(T.wiped);
      break;
    }
  }
});

/* ============================================================
   AI redirects
   ============================================================ */
function copyText(text){
  return new Promise(resolve => {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => resolve(true)).catch(() => resolve(false));
    } else {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed"; ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch(e){}
      ta.remove();
      resolve(ok);
    }
  });
}
function askGemini(prompt){
  const url = "https://gemini.google.com/app";
  copyText(prompt).then(ok => {
    toast(ok ? T.promptCopied : T.openingAI);
    window.open(url, "_blank", "noopener");
  });
}
function openAI(prompt, which){
  which = which || state.settings.ai || "deepseek";
  const urls = { deepseek: "https://chat.deepseek.com/", populi: "https://populi.ai/" };
  const url = urls[which] || urls.deepseek;
  copyText(prompt).then(ok => {
    toast(ok ? T.promptCopied : T.openingAI);
    window.open(url, "_blank", "noopener");
  });
}

/* ============================================================
   Toast / beep / notify
   ============================================================ */
let toastT = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.innerHTML = `<div class="tt">${esc(msg)}</div>`;
  el.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove("show"), 2800);
}
function beep(){
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.value = 880;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.55);
    o.start(); o.stop(ctx.currentTime + 0.6);
    setTimeout(() => ctx.close().catch(() => {}), 900);
  } catch(e){}
}
function sysNotify(title, body){
  try {
    if (state.settings.notifications && "Notification" in window && Notification.permission === "granted") {
      new Notification(title, {body});
    }
  } catch(e){}
}

/* ============================================================
   Reminders
   ============================================================ */
function checkReminders(){
  if (!state.profile) return;
  const now = new Date(), tk = dk(now);
  const hhmm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  state.reminded[tk] = state.reminded[tk] || {};
  let changed = false;
  state.habits.forEach(h => {
    if (!schedOn(h, now)) return;
    if (h.time !== hhmm) return;
    if (isDone(h.id, tk)) return;
    if (state.reminded[tk][h.id]) return;
    state.reminded[tk][h.id] = true;
    changed = true;
    toast(`⏰ ${h.name} — ${h.duration} min`);
    beep();
    if (navigator.vibrate) { try { navigator.vibrate([140, 70, 140]); } catch(e){} }
    sysNotify(`Time for ${h.name}`, `${h.duration} minutes.`);
  });
  const keys = Object.keys(state.reminded);
  if (keys.length > 5) { keys.sort(); while (keys.length > 3) delete state.reminded[keys.shift()]; changed = true; }
  if (changed) save();
}

/* ============================================================
   PWA install
   ============================================================ */
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
  const b = document.getElementById("installBtn");
  if (b) { b.disabled = false; b.textContent = T.install; }
});
window.addEventListener("appinstalled", () => { deferredPrompt = null; toast(T.installed); });
function installApp(){
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(c => {
      if (c.outcome === "accepted") toast(T.installedMsg);
      deferredPrompt = null;
    });
  } else {
    toast(T.installHelp);
  }
}

/* ============================================================
   Service worker
   ============================================================ */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
      await navigator.serviceWorker.register("sw.js", { scope: "./" });
    } catch (e) { console.warn("SW", e); }
  });
}

/* ============================================================
   Tick
   ============================================================ */
setInterval(() => {
  const t = state.timer;
  if (t && t.running) {
    if (Date.now() >= t.endsAt) { doneT(); return; }
    updateTimerUI();
  }
}, 400);
setInterval(checkReminders, 15000);
/* re-render background when level changes */
setInterval(() => { if (state.profile) applyBackground(); }, 60000);

/* ============================================================
   Boot
   ============================================================ */
try {
  if (state.profile) setLang(state.profile.lang);
  render();
  checkReminders();
} catch (e) {
  const el = document.getElementById("err");
  if (el) { el.style.display = "block"; el.textContent = "Boot error:\n" + ((e && e.stack) || e); }
  console.error(e);
}
</script>
