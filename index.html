<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0b0f14"/>
<title>Discipline Tracker</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b0f14; --card:#141a21; --card2:#1a222b; --line:#242e39;
  --text:#e6edf3; --muted:#8b98a5; --accent:#6ee7a8; --accent2:#5b8def;
  --warn:#f0a35e; --danger:#f87171; --radius:16px;
}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:48px;
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
h1,h2,h3,h4{margin:0 0 8px;line-height:1.25}
h3{font-size:15px;letter-spacing:.2px}
p{margin:0 0 10px}
.muted{color:var(--muted);font-size:13px}
.small{font-size:12px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(11,15,20,.88);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-in{max-width:720px;margin:0 auto;padding:12px 16px 8px;display:flex;align-items:center;gap:12px}
.brand{font-weight:700;letter-spacing:.2px;font-size:16px}
.brand span{color:var(--accent)}
.lvlbox{margin-left:auto;text-align:right;font-size:11px;color:var(--muted)}
.xpbar{width:96px;height:5px;border-radius:3px;background:var(--card2);overflow:hidden;margin-top:5px}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .3s}
.tabs{display:flex;gap:6px;max-width:720px;margin:0 auto;padding:0 12px 10px}
.tab{
  flex:1;text-align:center;padding:8px 4px;border-radius:10px;font-size:13px;
  color:var(--muted);cursor:pointer;border:1px solid transparent;background:none;
  font-family:inherit;transition:.15s;
}
.tab:hover{color:var(--text)}
.tab.active{background:var(--card);color:var(--text);border-color:var(--line)}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card.tight{padding:12px}
.row{display:flex;align-items:center;gap:12px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* ---------- buttons ---------- */
.btn{
  font:inherit;font-size:14px;padding:9px 14px;border-radius:11px;cursor:pointer;
  border:1px solid var(--line);background:var(--card2);color:var(--text);transition:.15s;
}
.btn:hover{border-color:#3a4756}
.btn.primary{background:linear-gradient(180deg,#6ee7a8,#4fd392);border-color:transparent;color:#06231a;font-weight:650}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:#3a2427;background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.block{width:100%;justify-content:center}
.btn:active{transform:scale(.98)}

/* ---------- inputs ---------- */
.in,.ta,select.in{
  width:100%;font:inherit;font-size:14px;color:var(--text);background:var(--card2);
  border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:10px;
  outline:none;transition:.15s;
}
.in:focus,.ta:focus{border-color:var(--accent2)}
.ta{resize:vertical;min-height:70px;line-height:1.5}
label.fl{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;letter-spacing:.3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- today ---------- */
.scorehero{display:flex;align-items:center;gap:16px}
.bigscore{font-size:34px;font-weight:700;letter-spacing:-1px;line-height:1}
.bigscore small{font-size:16px;color:var(--muted);font-weight:500}
.pct{color:var(--accent);font-weight:600;font-size:13px}
.chain{display:grid;grid-template-columns:repeat(28,1fr);gap:3px;margin-top:14px}
.dot{aspect-ratio:1;border-radius:3px;background:#1b232c}
.dot.lit{background:var(--accent)}
.dot.part{background:#3d6b55}
.dot.empty{background:#141a21;border:1px solid #1e2630}
.chainlegend{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--muted)}

.nextup{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius);
  background:linear-gradient(100deg,rgba(91,141,239,.18),rgba(110,231,168,.12));
  border:1px solid #26374a;margin-bottom:14px;
}
.nextup .nlabel{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--accent2)}

/* ---------- habit card ---------- */
.habit{padding:14px}
.habit .hname{font-weight:600;font-size:15px}
.habit .hmeta{font-size:12px;color:var(--muted);margin-top:2px}
.circle{
  width:40px;height:40px;border-radius:50%;flex:0 0 auto;cursor:pointer;
  border:2px solid #2c3743;background:transparent;color:transparent;
  display:grid;place-items:center;font-size:19px;transition:.15s;
}
.circle:hover{border-color:var(--accent)}
.circle.done{background:var(--accent);border-color:var(--accent);color:#06231a}
.strip{display:flex;gap:5px;margin-top:9px}
.sd{
  width:20px;height:20px;border-radius:6px;display:grid;place-items:center;
  font-size:10px;color:#5c6a78;background:#1b232c;
}
.sd.on{background:var(--accent);color:#06231a;font-weight:700}
.sd.miss{background:#2a1f22;color:#8a6068}
.sd.off{background:#12181f;color:#39434e}
.quote{
  margin-top:11px;padding-top:11px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--muted);font-style:italic;line-height:1.5;
}

/* ---------- progress ---------- */
.chart{display:flex;align-items:flex-end;gap:8px;height:120px;margin:6px 0 4px}
.barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar{width:100%;border-radius:6px 6px 3px 3px;background:#1e2731;min-height:4px;transition:.3s}
.bar.good{background:linear-gradient(180deg,#6ee7a8,#3fae7d)}
.bar.mid{background:linear-gradient(180deg,#f0c05e,#c98f34)}
.bar.low{background:linear-gradient(180deg,#f08a8a,#b95c5c)}
.barlab{font-size:10px;color:var(--muted)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stat{background:var(--card2);border-radius:12px;padding:10px 6px}
.stat b{display:block;font-size:19px}
.stat span{font-size:11px;color:var(--muted)}
.hbar{height:7px;border-radius:4px;background:#1b232c;overflow:hidden;margin-top:7px}
.hbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.daylist{display:flex;flex-direction:column;gap:7px}
.dayrow{display:flex;align-items:center;gap:10px;font-size:13px}
.dayrow .dname{width:52px;color:var(--muted);font-size:12px}
.dayrow .dbar{flex:1;height:7px;border-radius:4px;background:#1b232c;overflow:hidden}
.dayrow .dbar>i{display:block;height:100%;background:var(--accent2)}
.dayrow .dval{width:44px;text-align:right;font-size:12px;color:var(--muted)}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{
  flex:1;min-width:96px;text-align:center;padding:12px 8px;border-radius:14px;
  border:1px solid var(--line);background:var(--card2);opacity:.4;
}
.badge.on{opacity:1;border-color:#2f6b52;background:linear-gradient(180deg,rgba(110,231,168,.14),rgba(110,231,168,.04))}
.badge .bnum{font-size:20px;font-weight:700}
.badge .blab{font-size:11px;color:var(--muted)}

/* ---------- timer ---------- */
.timerwrap{display:flex;flex-direction:column;align-items:center;padding:10px 0 4px}
.ring{position:relative;width:220px;height:220px}
.ring svg{transform:rotate(-90deg)}
.ring .rt{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .rt b{font-size:44px;font-weight:700;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.ring .rt span{display:block;font-size:12px;color:var(--muted);margin-top:2px}

/* ---------- misc ---------- */
.pill{
  display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;
  background:var(--card2);border:1px solid var(--line);color:var(--muted);margin:0 4px 4px 0;
}
.daypick{display:flex;gap:6px;margin-bottom:12px}
.daypick label{
  flex:1;text-align:center;padding:9px 0;border-radius:10px;background:var(--card2);
  border:1px solid var(--line);cursor:pointer;font-size:12px;color:var(--muted);user-select:none;
}
.daypick input{display:none}
.daypick input:checked+span{color:#06231a}
.daypick label:has(input:checked){background:var(--accent);border-color:var(--accent);color:#06231a;font-weight:600}
.empty{text-align:center;padding:28px 16px;color:var(--muted);font-size:14px}
.backlink{background:none;border:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;padding:0 0 10px;display:block}
.backlink:hover{color:var(--text)}
ul.tips{margin:0;padding-left:18px;font-size:13.5px;color:#c3cdd7}
ul.tips li{margin-bottom:6px}
.book{border-left:2px solid var(--line);padding-left:11px;margin-bottom:12px}
.book b{font-size:13.5px}
.book .ba{font-size:11.5px;color:var(--accent2)}
.book p{font-size:13px;color:var(--muted);margin:4px 0 0}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);z-index:99;pointer-events:none;opacity:0;transition:.25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast .t{
  background:#1e2a35;border:1px solid #2f4050;border-radius:12px;padding:10px 16px;
  font-size:13.5px;box-shadow:0 8px 30px rgba(0,0,0,.5);white-space:nowrap;
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

const KEYWORDS = [
  ["sleep", ["sleep","bed","wake","rest","nap","night"]],
  ["exercise", ["run","gym","workout","exercise","walk","stretch","yoga","swim","cycle","bike","lift","cardio","push","squat"]],
  ["reading", ["read","book","novel","article"]],
  ["water", ["water","hydrate","drink"]],
  ["money", ["money","budget","save","saving","finance","expense","invest","spend"]],
  ["writing", ["write","writing","blog","diary","journal","essay","draft","gratitude"]],
  ["meditation", ["medit","mindful","breath","pray","calm"]],
  ["study", ["study","learn","course","exam","homework","class","lecture","revision","language","duolingo"]],
  ["skills", ["practice","practise","skill","code","coding","guitar","piano","draw","art","chess","programming"]]
];
function detectType(name) {
  const n = (name || "").toLowerCase();
  for (const [type, words] of KEYWORDS) {
    if (words.some(w => n.includes(w))) return type;
  }
  return "general";
}

/* ---------------- state ---------------- */
const KEY = "discipline-tracker-v1";
let state = loadState();

function seedState() {
  const t = today();
  const created = dk(addDays(t, -34));
  const habits = [
    { id: uid(), name: "Morning run",   time: "06:30", duration: 20, days: [1, 3, 5],                 type: "exercise",   created },
    { id: uid(), name: "Read a book",   time: "21:00", duration: 30, days: [0,1,2,3,4,5,6],           type: "reading",    created },
    { id: uid(), name: "Meditate",      time: "07:30", duration: 10, days: [0,1,2,3,4,5,6],           type: "meditation", created }
  ];
  const log = {};
  for (let i = 34; i >= 0; i--) {
    const d = addDays(t, -i), k = dk(d);
    const p = i < 4 ? 0.92 : 0.74;
    habits.forEach(h => {
      if (h.days.includes(d.getDay()) && Math.random() < p) {
        log[k] = log[k] || {};
        log[k][h.id] = true;
      }
    });
  }
  return { habits, log, reflections: {}, settings: { notifications: false }, reminded: {}, timer: null };
}

function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const s = JSON.parse(raw);
      s.habits = s.habits || [];
      s.log = s.log || {};
      s.reflections = s.reflections || {};
      s.settings = s.settings || { notifications: false };
      s.reminded = s.reminded || {};
      s.timer = s.timer || null;
      return s;
    }
  } catch (e) { console.warn("load failed", e); }
  const s = seedState();
  try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
  return s;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

/* ---------------- core logic ---------------- */
const scheduledOn = (h, d) => h.days.includes(d.getDay()) && dk(d) >= h.created;
const isDone = (id, k) => !!(state.log[k] && state.log[k][id]);

function markDone(id, k, val = true) {
  state.log[k] = state.log[k] || {};
  if (val) state.log[k][id] = true; else delete state.log[k][id];
  if (!Object.keys(state.log[k]).length) delete state.log[k];
  save();
}

function habitsOn(k) {
  const d = parseKey(k);
  return state.habits.filter(h => scheduledOn(h, d)).sort((a, b) => a.time.localeCompare(b.time));
}

function dayStats(k) {
  const hs = habitsOn(k);
  const done = hs.filter(h => isDone(h.id, k)).length;
  return { total: hs.length, done, pct: hs.length ? Math.round((done / hs.length) * 100) : 0 };
}

function currentStreak(h) {
  const t = today();
  let count = 0, d = new Date(t), guard = 0;
  while (guard++ < 4000) {
    if (dk(d) < h.created) break;
    if (scheduledOn(h, d)) {
      if (isDone(h.id, dk(d))) count++;
      else if (dk(d) !== dk(t)) break;
    }
    d = addDays(d, -1);
  }
  return count;
}

function bestStreak(h) {
  let best = 0, cur = 0;
  let d = parseKey(h.created);
  const t = today();
  let guard = 0;
  while (d <= t && guard++ < 4000) {
    if (scheduledOn(h, d)) {
      if (isDone(h.id, dk(d))) { cur++; if (cur > best) best = cur; }
      else if (dk(d) !== dk(t)) cur = 0;
    }
    d = addDays(d, 1);
  }
  return best;
}

function totalXP() {
  let n = 0;
  for (const k in state.log) for (const id in state.log[k]) if (state.log[k][id]) n++;
  return n;
}
const levelInfo = () => { const xp = totalXP(); return { xp, level: Math.floor(xp / 100) + 1, into: xp % 100 }; };

function quoteFor(h, k) {
  const arr = QUOTES[h.type] || QUOTES.general;
  return arr[hashStr(k + h.id) % arr.length];
}

function habitRate(h, days) {
  const t = today();
  let sched = 0, done = 0;
  for (let i = 0; i < days; i++) {
    const d = addDays(t, -i);
    if (scheduledOn(h, d)) { sched++; if (isDone(h.id, dk(d))) done++; }
  }
  return { sched, done, pct: sched ? Math.round((done / sched) * 100) : 0 };
}

/* ---------------- toast ---------------- */
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById("toast");
  el.innerHTML = `<div class="t">${esc(msg)}</div>`;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

/* ---------------- sound / notifications ---------------- */
function beep() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.value = 880;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.55);
    o.start(); o.stop(ctx.currentTime + 0.6);
    setTimeout(() => ctx.close().catch(() => {}), 900);
  } catch (e) {}
}
function systemNotify(title, body) {
  try {
    if (state.settings.notifications && "Notification" in window && Notification.permission === "granted") {
      new Notification(title, { body, icon: undefined });
    }
  } catch (e) {}
}

/* ---------------- routing ---------------- */
let route = { name: "today" };

function go(r) { route = r; render(); window.scrollTo(0, 0); }

/* ---------------- render ---------------- */
function render() {
  document.getElementById("app").innerHTML = topbarHTML() + `<main class="wrap">${pageHTML()}</main>`;
  postRender();
}

function topbarHTML() {
  const { level, into } = levelInfo();
  const tabs = [["today", "Today"], ["habits", "Habits"], ["progress", "Progress"], ["settings", "Settings"]];
  const active = route.name === "habit" ? "habits" : route.name === "timer" ? "today" : route.name;
  return `
  <div class="topbar">
    <div class="topbar-in">
      <div class="brand">Discipline<span>.</span></div>
      <div class="lvlbox">
        Lv ${level} · ${into}/100 XP
        <div class="xpbar"><i style="width:${into}%"></i></div>
      </div>
    </div>
    <div class="tabs">
      ${tabs.map(([id, label]) => `<button class="tab ${active === id ? "active" : ""}" data-act="tab" data-tab="${id}">${label}</button>`).join("")}
    </div>
  </div>`;
}

function pageHTML() {
  switch (route.name) {
    case "today":    return viewToday();
    case "habits":   return viewHabits();
    case "habit":    return viewHabitDetail(route.id);
    case "timer":    return viewTimer();
    case "progress": return viewProgress();
    case "settings": return viewSettings();
    default:         return viewToday();
  }
}

/* ============ TODAY ============ */
function viewToday() {
  const t = today(), tk = dk(t);
  const s = dayStats(tk);
  const hs = habitsOn(tk);

  let chain = "";
  for (let i = 27; i >= 0; i--) {
    const d = addDays(t, -i), k = dk(d), ds = dayStats(k);
    const cls = ds.total === 0 ? "dot empty" : (ds.done === ds.total ? "dot lit" : (ds.done > 0 ? "dot part" : "dot"));
    chain += `<div class="${cls}" title="${k} — ${ds.done}/${ds.total}"></div>`;
  }

  const pending = hs.filter(h => !isDone(h.id, tk));
  const nextUp = pending[0];

  const reflection = state.reflections[tk] || "";

  return `
  <div class="card">
    <div class="spread" style="margin-bottom:12px">
      <div class="muted small">${fmtDate(t)}</div>
      <div class="pct">${s.pct}%</div>
    </div>
    <div class="scorehero">
      <div class="bigscore">${s.done}<small>/${s.total}</small></div>
      <div class="muted small" style="flex:1">
        ${s.total === 0
          ? "Nothing scheduled today. Enjoy the rest."
          : (s.done === s.total ? "Perfect day. Chain intact." : `${s.total - s.done} habit${s.total - s.done === 1 ? "" : "s"} left today.`)}
      </div>
    </div>
    <div class="chain">${chain}</div>
    <div class="chainlegend"><span>28 days ago</span><span>Today</span></div>
  </div>

  ${hs.length === 0 ? "" : (nextUp ? `
    <div class="nextup">
      <div style="flex:1">
        <div class="nlabel">Next up</div>
        <div style="font-weight:600;margin-top:2px">${esc(nextUp.name)}</div>
        <div class="muted small">${nextUp.time} · ${nextUp.duration} min</div>
      </div>
      <button class="btn primary sm" data-act="timer" data-id="${nextUp.id}">Start</button>
    </div>` : `
    <div class="nextup">
      <div style="flex:1">
        <div class="nlabel">All clear</div>
        <div style="font-weight:600;margin-top:2px">Every habit done today 🎉</div>
      </div>
    </div>`)}

  ${hs.length === 0 ? `<div class="card empty">No habits scheduled today.<br><button class="btn primary sm" style="margin-top:12px" data-act="tab" data-tab="habits">Add a habit</button></div>` : ""}

  ${hs.map(h => habitCard(h, tk)).join("")}

  <div class="card">
    <h3>Reflection</h3>
    <p class="muted small">A note for today. Saved automatically.</p>
    <textarea class="ta" id="reflection" placeholder="What went well? What got in the way?">${esc(reflection)}</textarea>
  </div>
  <div style="height:8px"></div>`;
}

function habitCard(h, tk) {
  const done = isDone(h.id, tk);
  const streak = currentStreak(h);
  const t = today();
  let strip = "";
  for (let i = 6; i >= 0; i--) {
    const d = addDays(t, -i), k = dk(d);
    const sched = scheduledOn(h, d);
    const dn = isDone(h.id, k);
    strip += `<span class="sd ${!sched ? "off" : (dn ? "on" : "miss")}" title="${k}">${DAY_LETTER[d.getDay()]}</span>`;
  }
  return `
  <div class="card habit" data-act="habit" data-id="${h.id}" style="cursor:pointer">
    <div class="row">
      <button class="circle ${done ? "done" : ""}" data-act="toggle" data-id="${h.id}" aria-label="Mark done">✓</button>
      <div style="flex:1;min-width:0">
        <div class="hname" style="${done ? "opacity:.6" : ""}">${esc(h.name)}</div>
        <div class="hmeta">${h.time} · ${h.duration} min${streak > 0 ? ` · 🔥 ${streak} day${streak === 1 ? "" : "s"}` : ""}</div>
        <div class="strip">${strip}</div>
      </div>
      <button class="btn ghost sm" data-act="timer" data-id="${h.id}" aria-label="Timer">▶</button>
    </div>
    <div class="quote">“${esc(quoteFor(h, tk))}”</div>
  </div>`;
}

function addHabit() {
  const name = (document.getElementById("nh-name").value || "").trim();
  const time = document.getElementById("nh-time").value || "07:00";
  const duration = parseInt(document.getElementById("nh-duration").value, 10);
  const typeSel = document.getElementById("nh-type").value;
  const days = [...document.querySelectorAll("#nh-days input:checked")].map(i => parseInt(i.value, 10));

  if (!name) return toast("Give the habit a name");
  if (!duration || duration < 1) return toast("Duration in minutes is required");
  if (days.length === 0) return toast("Pick at least one day");

  state.habits.push({
    id: uid(),
    name,
    time,
    duration,
    days,
    type: typeSel === "auto" ? detectType(name) : typeSel,
    created: dk(today())
  });
  save();
  toast("Habit added");
  render();
}

/* ============ TIMER ============ */
function viewTimer() {
  const t = state.timer;
  if (!t) {
    return `<div class="card empty">No timer running.<br><br>
      <button class="btn primary sm" data-act="tab" data-tab="today">Back to Today</button></div>`;
  }
  const h = state.habits.find(x => x.id === t.habitId);
  if (!h) { state.timer = null; save(); return `<div class="card empty">Habit no longer exists.</div>`; }

  const remaining = t.running ? Math.max(0, t.endsAt - Date.now()) : t.remaining;
  const total = t.total || h.duration * 60000;
  const R = 96, C = 2 * Math.PI * R;
  const prog = Math.min(1, Math.max(0, 1 - remaining / total));

  return `
  <button class="backlink" data-act="habit" data-id="${h.id}">‹ ${esc(h.name)}</button>
  <div class="card">
    <div class="timerwrap">
      <div class="ring">
        <svg width="220" height="220">
          <circle cx="110" cy="110" r="${R}" fill="none" stroke="#1b232c" stroke-width="12"/>
          <circle id="tring" cx="110" cy="110" r="${R}" fill="none" stroke="#6ee7a8" stroke-width="12"
            stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - prog)).toFixed(1)}"/>
        </svg>
        <div class="rt">
          <div>
            <b id="tcount">${fmtMS(remaining)}</b>
            <span>${esc(h.name)}</span>
          </div>
        </div>
      </div>
      <div class="row" style="margin-top:22px;gap:8px;flex-wrap:wrap;justify-content:center">
        ${t.running
          ? `<button class="btn primary" data-act="tpause">Pause</button>`
          : `<button class="btn primary" data-act="tstart">${remaining < total ? "Resume" : "Start"}</button>`}
        <button class="btn" data-act="treset">Reset</button>
        <button class="btn" data-act="tdone">Mark done</button>
      </div>
      <p class="muted small" style="margin-top:16px;text-align:center">
        Keeps counting if you leave this page. The habit is marked done automatically when it reaches zero.
      </p>
    </div>
  </div>
  <div style="height:8px"></div>`;
}

function fmtMS(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return `${Math.floor(s / 60)}:${pad(s % 60)}`;
}

function updateTimerUI() {
  const t = state.timer;
  if (!t || route.name !== "timer") return;
  const count = document.getElementById("tcount");
  const ring = document.getElementById("tring");
  if (!count || !ring) return;
  const remaining = t.running ? Math.max(0, t.endsAt - Date.now()) : t.remaining;
  const total = t.total || 1;
  count.textContent = fmtMS(remaining);
  const C = 2 * Math.PI * 96;
  ring.setAttribute("stroke-dashoffset", (C * Math.min(1, Math.max(0, 1 - remaining / total))).toFixed(1));
}

function openTimer(id) {
  const h = state.habits.find(x => x.id === id);
  if (!h) return;
  const total = h.duration * 60000;
  state.timer = { habitId: id, total, remaining: total, endsAt: null, running: false };
  save();
  go({ name: "timer" });
}
function startTimer() {
  const t = state.timer; if (!t) return;
  if (t.remaining <= 0) t.remaining = t.total;
  t.endsAt = Date.now() + t.remaining;
  t.running = true;
  save(); render();
}
function pauseTimer() {
  const t = state.timer; if (!t || !t.running) return;
  t.remaining = Math.max(0, t.endsAt - Date.now());
  t.running = false;
  save(); render();
}
function resetTimer() {
  const t = state.timer; if (!t) return;
  t.remaining = t.total; t.running = false; t.endsAt = null;
  save(); render();
}
function completeTimer() {
  const t = state.timer; if (!t) return;
  markDone(t.habitId, dk(today()), true);
  const h = state.habits.find(x => x.id === t.habitId);
  state.timer = null;
  save();
  if (route.name === "timer") go({ name: "today" }); else render();
  if (h) toast(`${h.name} done ✓`);
  beep();
}

/* ============ PROGRESS ============ */
function viewProgress() {
  const t = today();

  // 7-day chart
  let chart = "";
  for (let i = 6; i >= 0; i--) {
    const d = addDays(t, -i), k = dk(d), s = dayStats(k);
    const cls = s.pct >= 80 ? "good" : s.pct >= 40 ? "mid" : (s.pct > 0 ? "low" : "");
    chart += `
      <div class="barcol">
        <div class="bar ${cls}" style="height:${Math.max(3, s.pct)}%" title="${k}: ${s.done}/${s.total}"></div>
        <div class="barlab">${DAY_LETTER[d.getDay()]}</div>
      </div>`;
  }

  // weekly review
  function week(offset) {
    let done = 0, total = 0;
    for (let i = 0; i < 7; i++) {
      const k = dk(addDays(t, -(offset * 7 + i)));
      const s = dayStats(k);
      done += s.done; total += s.total;
    }
    return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
  }
  const thisWeek = week(0), lastWeek = week(1);
  const delta = thisWeek.pct - lastWeek.pct;

  // strongest / weakest habit (last 7 days)
  const rates = state.habits.map(h => {
    const r = habitRate(h, 7);
    return { h, ...r };
  }).filter(x => x.sched > 0);
  const strongest = rates.length ? rates.reduce((a, b) => (b.pct > a.pct ? b : a)) : null;
  const weakest = rates.length ? rates.reduce((a, b) => (b.pct < a.pct ? b : a)) : null;

  // 14 day list
  let dayList = "";
  for (let i = 13; i >= 0; i--) {
    const d = addDays(t, -i), k = dk(d), s = dayStats(k);
    dayList += `
      <div class="dayrow">
        <div class="dname">${DAY_FULL[d.getDay()]} ${d.getDate()}</div>
        <div class="dbar"><i style="width:${s.pct}%"></i></div>
        <div class="dval">${s.done}/${s.total}</div>
      </div>`;
  }

  // 30 day per habit
  const perHabit = state.habits.map(h => {
    const r = habitRate(h, 30);
    return `
      <div style="margin-bottom:16px">
        <div class="spread">
          <div style="font-weight:600;font-size:14px">${esc(h.name)}</div>
          <div class="muted small">${r.pct}% · ${r.done}/${r.sched}</div>
        </div>
        <div class="hbar"><i style="width:${r.pct}%"></i></div>
        <div class="muted small" style="margin-top:6px">🔥 ${currentStreak(h)} current · ${bestStreak(h)} best</div>
      </div>`;
  }).join("");

  // badges
  const maxBest = state.habits.length ? Math.max(...state.habits.map(bestStreak)) : 0;
  const THRESH = [7, 21, 66];
  const badges = THRESH.map(n => `
    <div class="badge ${maxBest >= n ? "on" : ""}">
      <div class="bnum">${n}</div>
      <div class="blab">day streak</div>
    </div>`).join("");

  return `
  <h3 style="margin:6px 0 10px">Last 7 days</h3>
  <div class="card">
    <div class="chart">${chart}</div>
  </div>

  <h3 style="margin:18px 0 10px">Weekly review</h3>
  <div class="card">
    <div class="statgrid">
      <div class="stat"><b>${thisWeek.pct}%</b><span>This week</span></div>
      <div class="stat"><b>${lastWeek.pct}%</b><span>Last week</span></div>
      <div class="stat"><b style="color:${delta > 0 ? "var(--accent)" : delta < 0 ? "var(--danger)" : "var(--text)"}">${delta > 0 ? "+" : ""}${delta}%</b><span>Change</span></div>
    </div>
    ${strongest ? `
      <div style="margin-top:16px;font-size:13.5px">
        <div>💪 <b>Strongest:</b> ${esc(strongest.h.name)} — ${strongest.pct}%</div>
        <div style="margin-top:6px">🎯 <b>Needs work:</b> ${esc(weakest.h.name)} — ${weakest.pct}%</div>
      </div>` : `<p class="muted small" style="margin-top:14px">Nothing scheduled in the last 7 days.</p>`}
  </div>

  <h3 style="margin:18px 0 10px">Day by day (14 days)</h3>
  <div class="card"><div class="daylist">${dayList}</div></div>

  <h3 style="margin:18px 0 10px">Per habit (30 days)</h3>
  <div class="card">
    ${state.habits.length ? perHabit : `<p class="muted small">No habits yet.</p>`}
  </div>

  <h3 style="margin:18px 0 10px">Badges</h3>
  <div class="card">
    <div class="badges">${badges}</div>
    <p class="muted small" style="margin-top:12px">Longest streak so far: <b>${maxBest}</b> days.</p>
  </div>
  <div style="height:8px"></div>`;
}

/* ============ SETTINGS ============ */
function viewSettings() {
  const on = !!state.settings.notifications;
  const supported = "Notification" in window;
  const perm = supported ? Notification.permission : "unsupported";

  return `
  <h3 style="margin:6px 0 10px">Notifications</h3>
  <div class="card">
    <div class="spread">
      <div>
        <div style="font-weight:600">System notifications</div>
        <div class="muted small" style="margin-top:3px">
          ${supported ? `Permission: ${perm}` : "Not supported in this browser"}
        </div>
      </div>
      <button class="btn ${on ? "primary" : ""}" data-act="notif">${on ? "On" : "Off"}</button>
    </div>
    <p class="muted small" style="margin-top:12px">
      Reminders fire at each habit's time while the app is open: a banner, a beep and a vibration.
      A reminder is skipped if the habit is already done.
    </p>
  </div>

  <h3 style="margin:18px 0 10px">Data</h3>
  <div class="card">
    <p class="muted small">Your data lives only on this device. Export a backup file, or import one you made earlier.</p>
    <button class="btn block" style="margin-bottom:10px" data-act="export">Export backup (.json)</button>
    <button class="btn block" style="margin-bottom:10px" data-act="import">Import backup</button>
    <input type="file" id="importfile" accept="application/json,.json" hidden>
    <button class="btn danger block" data-act="wipe">Reset all data</button>
  </div>

  <h3 style="margin:18px 0 10px">Stats</h3>
  <div class="card">
    <div class="statgrid">
      <div class="stat"><b>${state.habits.length}</b><span>Habits</span></div>
      <div class="stat"><b>${totalXP()}</b><span>Total XP</span></div>
      <div class="stat"><b>${levelInfo().level}</b><span>Level</span></div>
    </div>
  </div>
  <div style="height:8px"></div>`;
}

/* ---------------- post-render wiring ---------------- */
function postRender() {
  const refl = document.getElementById("reflection");
  if (refl) {
    refl.addEventListener("input", () => {
      const k = dk(today());
      state.reflections[k] = refl.value;
      save();
    });
  }
  const file = document.getElementById("importfile");
  if (file) {
    file.addEventListener("change", e => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!data || !Array.isArray(data.habits)) throw new Error("bad file");
          state = {
            habits: data.habits,
            log: data.log || {},
            reflections: data.reflections || {},
            settings: data.settings || { notifications: false },
            reminded: {},
            timer: null
          };
          save(); render(); toast("Backup imported");
        } catch (err) { toast("That file could not be read"); }
      };
      reader.readAsText(f);
      e.target.value = "";
    });
  }
}

/* ---------------- click handling ---------------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;

  switch (act) {
    case "tab":
      go({ name: el.dataset.tab });
      break;

    case "toggle": {
      const id = el.dataset.id, k = dk(today());
      const nowDone = !isDone(id, k);
      markDone(id, k, nowDone);
      if (nowDone) { const h = state.habits.find(x => x.id === id); toast(`${h ? h.name : "Habit"} done ✓`); }
      render();
      break;
    }

    case "habit":
      go({ name: "habit", id: el.dataset.id });
      break;

    case "timer":
      openTimer(el.dataset.id);
      break;

    case "del": {
      const id = el.dataset.id;
      const h = state.habits.find(x => x.id === id);
      if (!h) break;
      if (!confirm(`Delete "${h.name}"? Its history will be removed from view.`)) break;
      state.habits = state.habits.filter(x => x.id !== id);
      if (state.timer && state.timer.habitId === id) state.timer = null;
      save(); toast("Habit deleted"); render();
      break;
    }

    case "addhabit":
      addHabit();
      break;

    case "coach": {
      const h = state.habits.find(x => x.id === el.dataset.id);
      const box = document.getElementById("coach-in");
      const txt = box ? box.value.trim() : "";
      if (!h) break;
      if (!txt) { toast("Describe what you do first"); break; }
      const prompt =
`I'm working on this daily habit: "${h.name}" (${h.duration} minutes, scheduled at ${h.time}).

What I do: ${txt}

Please act as my habit coach. Give me specific, practical advice: what to change, how to handle the obstacle I described, and one small thing to try tomorrow.`;
      window.open("https://claude.ai/new?q=" + encodeURIComponent(prompt), "_blank");
      break;
    }

    case "quiz": {
      const h = state.habits.find(x => x.id === el.dataset.id);
      const topicEl = document.getElementById("quiz-topic");
      const diffEl = document.getElementById("quiz-diff");
      const topic = topicEl ? topicEl.value.trim() : "";
      const diff = diffEl ? diffEl.value : "Medium";
      if (!topic) { toast("Enter a topic first"); break; }
      const prompt =
`Quiz me on: ${topic}
Difficulty: ${diff}
Context: I'm building a daily habit called "${h ? h.name : "this"}".

Ask me 5 questions, one at a time. Wait for my answer before asking the next question. After each answer, tell me whether I was right, give a brief explanation, then move on. At the end, give me a score out of 5 and one thing to review.`;
      window.open("https://claude.ai/new?q=" + encodeURIComponent(prompt), "_blank");
      break;
    }

    case "tstart":  startTimer(); break;
    case "tpause":  pauseTimer(); break;
    case "treset":  resetTimer(); break;
    case "tdone":   completeTimer(); break;

    case "notif": {
      if (!("Notification" in window)) { toast("Notifications not supported"); break; }
      if (state.settings.notifications) {
        state.settings.notifications = false; save(); render(); toast("Notifications off");
      } else {
        Notification.requestPermission().then(p => {
          state.settings.notifications = (p === "granted");
          save(); render();
          toast(p === "granted" ? "Notifications on" : "Permission denied");
        });
      }
      break;
    }

    case "export": {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `discipline-tracker-${dk(today())}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      toast("Backup downloaded");
      break;
    }

    case "import": {
      const f = document.getElementById("importfile");
      if (f) f.click();
      break;
    }

    case "wipe": {
      if (!confirm("Erase all habits, history and reflections? This cannot be undone.")) return;
      localStorage.removeItem(KEY);
      state = { habits: [], log: {}, reflections: {}, settings: { notifications: false }, reminded: {}, timer: null };
      save(); go({ name: "today" }); toast("All data cleared");
      break;
    }
  }
});

/* ---------------- reminders ---------------- */
function checkReminders() {
  const now = new Date();
  const tk = dk(now);
  const hhmm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  state.reminded[tk] = state.reminded[tk] || {};
  let changed = false;

  state.habits.forEach(h => {
    if (!scheduledOn(h, now)) return;
    if (h.time !== hhmm) return;
    if (isDone(h.id, tk)) return;
    if (state.reminded[tk][h.id]) return;

    state.reminded[tk][h.id] = true;
    changed = true;

    toast(`⏰ ${h.name} — ${h.duration} min`);
    beep();
    if (navigator.vibrate) { try { navigator.vibrate([140, 70, 140]); } catch (e) {} }
    systemNotify(`Time for ${h.name}`, `${h.duration} minutes. Tap to mark it done.`);
  });

  // prune old reminder records
  const keys = Object.keys(state.reminded);
  if (keys.length > 5) {
    keys.sort();
    while (keys.length > 3) delete state.reminded[keys.shift()];
    changed = true;
  }
  if (changed) save();
}

/* ---------------- global tick ---------------- */
setInterval(() => {
  const t = state.timer;
  if (t && t.running) {
    if (Date.now() >= t.endsAt) { completeTimer(); return; }
    updateTimerUI();
  }
}, 400);

setInterval(checkReminders, 15000);

/* ---------------- boot ---------------- */
render();
checkReminders();
</script>
</body>
